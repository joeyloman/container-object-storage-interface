{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "cosi.fullname" . }}
  labels:
    {{- include "cosi.labels" . | nindent 4 }}
rules:
  # Keep these rules in sync with controller/resources/role.yaml, which
  # 'make rbac' generates from the reconciler markers.
  - apiGroups:
      - ""
    resources:
      - events
    verbs:
      - create
  - apiGroups:
      - objectstorage.k8s.io
    resources:
      - bucketaccessclasses
      - bucketclasses
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - objectstorage.k8s.io
    resources:
      - bucketaccesses
      - bucketclaims
    verbs:
      - get
      - list
      - update
      - watch
  - apiGroups:
      - objectstorage.k8s.io
    resources:
      - bucketaccesses/finalizers
      - bucketclaims/finalizers
      - buckets/finalizers
    verbs:
      - update
  - apiGroups:
      - objectstorage.k8s.io
    resources:
      - bucketaccesses/status
      - bucketclaims/status
      - buckets/status
    verbs:
      - get
      - update
  - apiGroups:
      - objectstorage.k8s.io
    resources:
      - buckets
    verbs:
      - create
      - delete
      - get
      - list
      - update
      - watch
  {{- if and .Values.metrics.enabled .Values.metrics.secure }}
  # Required by the metrics endpoint's authentication and authorization filter.
  - apiGroups:
      - authentication.k8s.io
    resources:
      - tokenreviews
    verbs:
      - create
  - apiGroups:
      - authorization.k8s.io
    resources:
      - subjectaccessreviews
    verbs:
      - create
  {{- end }}
{{- end }}
